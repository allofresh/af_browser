name: allofresh_browser
description: A Wrapper of BukaBrowser Class to make it testable.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=2.19.6 <4.0.0"
  flutter: ">=3.7.12"
  
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.2.2
  equatable: ^2.0.5
  dio: ^4.0.6
  json_serializable: ^6.5.4
  json_annotation: ^4.7.0
  rxdart: ^0.27.7
  mocktail: ^1.0.0
  url_launcher: ^6.1.11
  go_router: ^14.2.1

dependency_overrides:
  web: ^0.5.1 # fix firebase_performance version resolving
  js: ^0.7.1 # fix datadog_flutter_plugin version resolving. remove this after sdk update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.2
  webview_flutter_platform_interface: 2.6.0
  plugin_platform_interface: 2.1.6

